<svg width="188" height="48" viewBox="0 0 188 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Rubellite Wealth Management">
  <!-- Faceted hexagonal gem mark -->
  <g transform="translate(1, 4)">
    <!-- Outer hexagon -->
    <polygon points="20,0 37,10 37,30 20,40 3,30 3,10"
      fill="none" stroke="#B9A590" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Inner hexagon -->
    <polygon points="20,8 30,14 30,26 20,32 10,26 10,14"
      fill="none" stroke="#B9A590" stroke-width="0.7" stroke-linejoin="round" opacity="0.45"/>
    <!-- Facet lines outer-to-inner -->
    <line x1="20" y1="0"  x2="20" y2="8"  stroke="#B9A590" stroke-width="0.7" opacity="0.4"/>
    <line x1="37" y1="10" x2="30" y2="14" stroke="#B9A590" stroke-width="0.7" opacity="0.4"/>
    <line x1="37" y1="30" x2="30" y2="26" stroke="#B9A590" stroke-width="0.7" opacity="0.4"/>
    <line x1="20" y1="40" x2="20" y2="32" stroke="#B9A590" stroke-width="0.7" opacity="0.4"/>
    <line x1="3"  y1="30" x2="10" y2="26" stroke="#B9A590" stroke-width="0.7" opacity="0.4"/>
    <line x1="3"  y1="10" x2="10" y2="14" stroke="#B9A590" stroke-width="0.7" opacity="0.4"/>
    <!-- Centre point -->
    <circle cx="20" cy="20" r="1.2" fill="#B9A590" opacity="0.55"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="23" font-family="Georgia, 'Times New Roman', serif"
        font-size="13.5" font-weight="400" letter-spacing="3.5" fill="#36302A">RUBELLITE</text>
  <text x="52" y="38" font-family="Georgia, 'Times New Roman', serif"
        font-size="8.5" letter-spacing="2.8" fill="#B9A590">WEALTH MANAGEMENT</text>
</svg>
